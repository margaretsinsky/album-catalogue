<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitleTag">The Whole Album Catalog</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: #fff;
    color: #111;
    max-width: 600px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }
  a { color: #111; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 2px solid #111;
    padding-bottom: 10px;
    margin-bottom: 30px;
  }
  header h1 { font-size: 1.1rem; margin: 0; font-weight: normal; letter-spacing: 0.5px; }
  header a { font-size: 0.85rem; text-decoration: none; border: 1px solid #111; padding: 4px 10px; }

  #status { font-family: 'Courier New', monospace; font-size: 0.85rem; color: #666; }

  .entry {
    border-bottom: 1px solid #ddd;
    padding: 16px 0;
  }
  .entry .cover { width: 100%; max-width: 300px; display: block; margin-bottom: 12px; border: 1px solid #ddd; }
.carousel-cover {
  flex: 0 0 200px;
  height: 200px;
  object-fit: cover;
  border: 1px solid #ddd;
  scroll-snap-align: center;
  cursor: pointer;
  transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
}
.carousel-cover.selected {
  transform: scale(1.18);
}
  .entry .title { font-size: 1.15rem; margin: 0 0 4px; }
  .entry .artist { font-size: 1rem; color: #333; margin: 0 0 8px; }
  .entry .meta {
    font-family: 'Courier New', monospace;
    font-size: 0.8rem;
    color: #666;
  }
  .entry .note {
  font-size: 0.85rem;
  color: #999;
  margin-top: 6px;
  font-style: italic;
}
 body:not(.show-notes) .note {
  display: none;
}
</style>
</head>
<body>

<header>
  <h1 id="pageTitle">The Whole Album Catalog</h1>
  <a href="add.html" id="addLink">Add</a>
</header>

<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 16px; max-width: 100%;">
  <input type="text" id="searchInput" placeholder="Search" style="flex: 1; min-width: 0; margin-bottom: 0;" oninput="applySearch()">
  <select id="sortSelect" onchange="applySearch()" style="font-family: 'Courier New', monospace; font-size: 0.7rem; padding: 4px 8px; width: auto; max-width: 40vw; flex-shrink: 0;">
   
  <option value="default">Sort: default</option>
  <option value="artist">Sort: artist A–Z</option>
  <option value="album">Sort: album A–Z</option>
  <option value="year-asc">Sort: year (oldest first)</option>
  <option value="year-desc">Sort: year (newest first)</option>
</select>
</div>

<div class="row" style="margin-bottom: 20px;">
  <button class="secondary" id="viewToggle" onclick="toggleView()">Switch to list</button>
  <span id="status">Loading…</span>
</div>

<div id="listView" style="display: none;">
  <div id="entries"></div>
</div>

<div id="carouselView">
  <div id="carouselTrack" style="display: flex; align-items: center; gap: 28px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 24px 0 44px;"></div>
  <div id="carouselDetails" style="margin-top: 20px; min-height: 100px;"></div>
</div>
 
<div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px;">
  <label style="font-family: 'Courier New', monospace; font-size: 0.75rem; color: #999; display: flex; align-items: center; gap: 5px; cursor: pointer;">
    <input type="checkbox" id="showNotesToggle" onchange="toggleNotes()">
    Show notes
  </label>
  <div id="countFooter" style="text-align: right; font-family: 'Courier New', monospace; font-size: 0.8rem; color: #666;"></div>
</div>
 
<script src="config.js"></script>
<script>
document.getElementById('pageTitleTag').textContent = `The Whole ${ITEM_NAME} Catalog`;
document.getElementById('pageTitle').textContent = `The Whole ${ITEM_NAME} Catalog`;
document.getElementById('addLink').textContent = `Add ${ITEM_NAME}`;

let allEntries = [];
let visibleEntries = [];
let currentView = 'carousel';
 
 async function loadEntries() {
  const pw = await ensureAuthenticated();
  const statusEl = document.getElementById('status');
  const entriesEl = document.getElementById('entries');

  const slowLoadTimer = setTimeout(() => {
  statusEl.textContent = 'Waking up the catalog… this can take up to 30 seconds after being idle.';
  }, 2000);

  try {
    const res = await fetch(`${API_URL}?secret=${encodeURIComponent(pw)}`);
    
    clearTimeout(slowLoadTimer);
    
    const data = await res.json();

    if (data.status === 'error') {
      statusEl.textContent = 'Wrong password. Refresh the page and try again.';
      sessionStorage.removeItem('catalog_pw');
      return;
    }

    if (!Array.isArray(data) || data.length === 0) {
      statusEl.textContent = `No ${ITEM_NAME.toLowerCase()} yet. Add your first one.`;
      return;
    }

    statusEl.textContent = '';

    allEntries = data;
    visibleEntries = data;
   
   renderCarousel();

   updateCount();
   
   renderListView();

  } catch (err) {
  clearTimeout(slowLoadTimer);
  statusEl.textContent = 'Could not load catalog. Check your connection and refresh.';
  }
}

function applySearch() {
  const query = document.getElementById('searchInput').value.trim().toLowerCase();

  if (!query) {
    visibleEntries = allEntries;
  } else {
    visibleEntries = allEntries.filter(entry => {
      const haystack = [
        entry.Artist, entry.Album, entry.Genre, entry.Year, entry.Notes
      ].map(v => String(v ?? '').toLowerCase()).join(' ');
      return haystack.includes(query);
    });
  }

  applySort();
  renderListView();
  if (currentView === 'carousel') {
    renderCarousel();
  }
  updateCount();
}

function updateCount() {
  const plural = visibleEntries.length === 1 ? ITEM_NAME.toLowerCase() : `${ITEM_NAME.toLowerCase()}s`;
  document.getElementById('countFooter').textContent = `${visibleEntries.length} ${plural}`;
}

function applySort() {
  const sortBy = document.getElementById('sortSelect').value;

  visibleEntries.sort((a, b) => {
    if (sortBy === 'artist') {
      return (a.Artist || '').localeCompare(b.Artist || '');
    }
    if (sortBy === 'album') {
      return (a.Album || '').localeCompare(b.Album || '');
    }
    if (sortBy === 'year-asc') {
      return (Number(a.Year) || 0) - (Number(b.Year) || 0);
    }
    if (sortBy === 'year-desc') {
      return (Number(b.Year) || 0) - (Number(a.Year) || 0);
    }
    // default
    return (a.Genre || '').localeCompare(b.Genre || '')
      || (a.Artist || '').localeCompare(b.Artist || '')
      || (a.Album || '').localeCompare(b.Album || '');
  });
}

function toggleNotes() {
  document.body.classList.toggle('show-notes', document.getElementById('showNotesToggle').checked);
}

function renderListView() {
  const entriesEl = document.getElementById('entries');
  entriesEl.innerHTML = visibleEntries.map((entry, i) => `
    <div class="entry">
      <img class="cover" src="${driveImageUrl(entry.FrontPhotoURL)}" alt="${escapeHtml(entry.Album)} cover"
           loading="lazy" data-showing="front" style="cursor: pointer;"
           onclick="flipListCover(this, ${i})">
      <p class="title">${escapeHtml(entry.Album)}</p>
      <p class="artist">${escapeHtml(entry.Artist)}</p>
      <p class="meta">${escapeHtml(entry.Genre)} · ${escapeHtml(String(entry.Year))}</p>
      ${entry.Notes ? `<p class="note">Notes: ${escapeHtml(entry.Notes)}</p>` : ''}
    </div>
  `).join('');
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'list') {
    currentView = 'carousel';
    document.getElementById('listView').style.display = 'none';
    document.getElementById('carouselView').style.display = 'block';
    btn.textContent = 'Switch to list';
    renderCarousel();
  } else {
    currentView = 'list';
    document.getElementById('listView').style.display = 'block';
    document.getElementById('carouselView').style.display = 'none';
    btn.textContent = 'Switch to carousel';
  }
}

function renderCarousel() {
  const track = document.getElementById('carouselTrack');
  track.innerHTML = `<div style="flex: 0 0 40vw;"></div>` + visibleEntries.map((entry, i) => `
    <img class="carousel-cover" src="${driveImageUrl(entry.FrontPhotoURL)}"
         alt="${escapeHtml(entry.Album)}" data-index="${i}" data-showing="front"
         onclick="flipCover(this, ${i})">
  `).join('') + `<div style="flex: 0 0 40vw;"></div>`;
  track.querySelectorAll('.carousel-cover').forEach(img => {
    img.addEventListener('load', () => {
      if (track.dataset.initialized) return;
    });
  });
  if (visibleEntries.length > 0) {
  showCarouselDetails(0);
  const firstImg = track.querySelector('.carousel-cover[data-index="0"]');
  if (firstImg) {
    track.scrollLeft = firstImg.offsetLeft - (track.clientWidth - firstImg.offsetWidth) / 2;
  }
}
  let scrollTimeout;
  track.addEventListener('scroll', () => {
    clearTimeout(scrollTimeout);
    scrollTimeout = setTimeout(() => {
      const trackRect = track.getBoundingClientRect();
      const center = trackRect.left + trackRect.width / 2;
      let closest = 0;
      let closestDist = Infinity;
      track.querySelectorAll('.carousel-cover').forEach((img, i) => {
        const rect = img.getBoundingClientRect();
        const imgCenter = rect.left + rect.width / 2;
        const dist = Math.abs(imgCenter - center);
        if (dist < closestDist) {
          closestDist = dist;
          closest = i;
        }
      });
      showCarouselDetails(closest);
    }, 60);
  });
}

function flipCover(imgEl, i) {
  const entry = visibleEntries[i];
  const showingFront = imgEl.dataset.showing === 'front';
  imgEl.src = driveImageUrl(showingFront ? entry.BackPhotoURL : entry.FrontPhotoURL);
  imgEl.dataset.showing = showingFront ? 'back' : 'front';
  imgEl.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
}
function flipListCover(imgEl, i) {
  const entry = visibleEntries[i];
  const showingFront = imgEl.dataset.showing === 'front';
  imgEl.src = driveImageUrl(showingFront ? entry.BackPhotoURL : entry.FrontPhotoURL);
  imgEl.dataset.showing = showingFront ? 'back' : 'front';
}

function showCarouselDetails(i) {
  const entry = visibleEntries[i];
  if (!entry) return;

  document.querySelectorAll('.carousel-cover.selected').forEach(el => el.classList.remove('selected'));
  const selectedImg = document.querySelector(`.carousel-cover[data-index="${i}"]`);
  if (selectedImg) selectedImg.classList.add('selected');

  document.getElementById('carouselDetails').innerHTML = `
    <div class="entry">
      <p class="title">${escapeHtml(entry.Album)}</p>
      <p class="artist">${escapeHtml(entry.Artist)}</p>
      <p class="meta">${escapeHtml(entry.Genre)} · ${escapeHtml(String(entry.Year))}</p>
      ${entry.Notes ? `<p class="note">Notes: ${escapeHtml(entry.Notes)}</p>` : ''}
    </div>
  `;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

function driveImageUrl(driveLink) {
  if (!driveLink) return '';
  const match = driveLink.match(/[-\w]{25,}/);
  if (!match) return '';
  return `https://drive.google.com/thumbnail?id=${match[0]}&sz=w600`;
}

loadEntries();
</script>
</body>
</html>
